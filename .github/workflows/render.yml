name: Render video

on:
  workflow_dispatch:
    inputs:
      video:
        description: "Video directory under hyperframes/ (e.g. ch2-v1)"
        required: true
        default: ch2-v1
      tts:
        description: "Include Kannada voiceover? (true/false)"
        required: false
        default: "false"
      upload:
        description: "Upload to Drive + YouTube private? (true/false)"
        required: false
        default: "true"

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt-get update --allow-releaseinfo-change -qq
          sudo apt-get install -y -qq ffmpeg \
            libglib2.0-0 libnss3 libnspr4 libdbus-1-3 \
            libatk1.0-0 libatk-bridge2.0-0 libcups2 \
            libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 \
            libxfixes3 libxrandr2 libgbm1 libasound2 \
            libx11-6 libxcb1 libxext6

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install HyperFrames
        run: npm install -g hyperframes

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: pip install gTTS

      - name: Render + upload
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GDRIVE_FOLDER_ID:            ${{ secrets.GDRIVE_FOLDER_ID }}
          YOUTUBE_REFRESH_TOKEN:       ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_CLIENT_ID:           ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET:       ${{ secrets.YOUTUBE_CLIENT_SECRET }}
        run: |
          FLAGS=""
          if [ "${{ inputs.tts }}"     = "true" ]; then FLAGS="$FLAGS --tts";    fi
          if [ "${{ inputs.upload }}"  = "true" ]; then FLAGS="$FLAGS --upload"; fi
          python3 pipeline/hf_build.py hyperframes/${{ inputs.video }}/ $FLAGS

      - name: Save artifact (fallback if Drive upload skipped)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.video }}-${{ github.run_id }}
          path: |
            hyperframes/${{ inputs.video }}/*-final.mp4
            hyperframes/${{ inputs.video }}/*.srt
            hyperframes/${{ inputs.video }}/thumbnail.jpg
          retention-days: 7
