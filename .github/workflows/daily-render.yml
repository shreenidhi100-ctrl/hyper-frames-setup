name: Daily video render
on:
  schedule:
    - cron: "30 2 * * *"   # 08:00 IST
  workflow_dispatch: {}
jobs:
  hosted-runner-probe:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 2
    outputs:
      available: ${{ steps.ready.outputs.available }}
    steps:
      - id: ready
        run: echo "available=true" >> "$GITHUB_OUTPUT"

  render:
    needs: hosted-runner-probe
    if: ${{ always() }}
    runs-on: ${{ needs.hosted-runner-probe.outputs.available == 'true' && 'ubuntu-latest' || fromJSON(vars.SELF_HOSTED_LABELS || '["self-hosted"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg fonts-freefont-ttf
          pip install -r requirements.txt
          playwright install chromium --with-deps
      - run: ./run.sh
      - uses: actions/upload-artifact@v4
        with:
          name: render-${{ github.run_id }}
          path: |
            out/**/*.mp4
            out/**/*.srt
